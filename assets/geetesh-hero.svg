<svg xmlns="http://www.w3.org/2000/svg" width="1667" height="520" viewBox="0 0 1667 520" role="img" aria-labelledby="title desc">
  <title id="title">Geetesh Vaity — Developer Profile 2026</title>
  <desc id="desc">Cream paper-textured developer profile banner with bold black typography, yellow accents and an orbital illustration.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffdf7"/><stop offset=".55" stop-color="#f7f1e6"/><stop offset="1" stop-color="#fffaf0"/></linearGradient>
    <radialGradient id="warmGlow"><stop offset="0" stop-color="#ffd43b" stop-opacity=".32"/><stop offset="1" stop-color="#ffd43b" stop-opacity="0"/></radialGradient>
    <pattern id="grain" width="120" height="120" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="15" r=".8" fill="#514a3c" opacity=".10"/><circle cx="44" cy="72" r=".7" fill="#514a3c" opacity=".09"/><circle cx="91" cy="26" r=".65" fill="#514a3c" opacity=".08"/><circle cx="108" cy="101" r=".8" fill="#514a3c" opacity=".08"/><circle cx="27" cy="110" r=".55" fill="#514a3c" opacity=".10"/>
      <path d="M62 8l2 1M15 53l2-1M78 88l2 1M112 48l2-1" stroke="#514a3c" stroke-width=".7" opacity=".08"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur in="SourceAlpha" stdDeviation="7"/><feOffset dx="4" dy="7" result="off"/><feComponentTransfer><feFuncA type="linear" slope=".22"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <rect width="1667" height="520" fill="#22211f"/>
  <rect x="31" y="26" width="1605" height="490" rx="22" fill="url(#paper)" stroke="#d8cfbd" stroke-width="1.5"/>
  <rect x="32" y="27" width="1603" height="488" rx="21" fill="url(#grain)" opacity=".85"/>
  <ellipse cx="1407" cy="231" rx="285" ry="245" fill="url(#warmGlow)" filter="url(#softGlow)"/>

  <!-- Header label -->
  <g filter="url(#shadow)" transform="rotate(-1.2 365 105)">
    <path d="M130 78L604 72L606 131L132 137Z" fill="#171717"/>
    <rect x="569" y="89" width="24" height="24" fill="#ffd43b"/>
    <text x="158" y="116" fill="#fffdf5" font-family="Courier New, monospace" font-size="22" font-weight="700" letter-spacing="3">DEVELOPER PROFILE / 2026</text>
  </g>
  <text x="1535" y="83" fill="#25231f" font-family="Courier New, monospace" font-size="23" font-weight="700" letter-spacing="2">01 / ∞</text>

  <!-- Name and brush underline -->
  <path d="M122 249L1006 246L999 278L119 283Z" fill="#ffd02f"/>
  <text x="128" y="263" fill="#171717" font-family="Georgia, 'Times New Roman', serif" font-size="99" font-weight="700" letter-spacing="-2">GEETESH VAITY</text>
  <text x="132" y="334" fill="#242321" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" letter-spacing="2.2">IT UNDERGRADUATE  ·  SOFTWARE DEVELOPER</text>

  <!-- Yellow torn-paper strip -->
  <g filter="url(#shadow)">
    <path d="M109 369L825 364L838 370L831 379L837 389L829 398L835 408L824 418L112 421L108 412L113 403L106 393L113 382Z" fill="#ffd02f"/>
    <text x="133" y="403" fill="#211f1b" font-family="Courier New, monospace" font-size="25" font-weight="700" letter-spacing="1.3">MOBILE / BACKEND / CLOUD / APPLIED AI</text>
  </g>

  <!-- Divider and tagline -->
  <path d="M132 452H969" stroke="#282622" stroke-width="2.5"/>
  <text x="132" y="505" fill="#34312b" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="3">CURIOSITY IN MIND. CREATIVITY IN CODE.</text>

  <!-- Orbital illustration -->
  <g transform="translate(1391 256)" fill="none" stroke="#302d27" stroke-width="2.3">
    <circle r="151" stroke-dasharray="3 12" opacity=".75"/>
    <ellipse rx="211" ry="77" transform="rotate(-31)"/>
    <ellipse rx="211" ry="77" transform="rotate(48)"/>
    <ellipse rx="211" ry="77" transform="rotate(111)" opacity=".9"/>
  </g>
  <circle cx="1510" cy="174" r="9" fill="#24221e"/>
  <circle cx="1198" cy="379" r="10" fill="#f4bd00"/>
  <text x="1131" y="502" fill="#34312b" font-family="Courier New, monospace" font-size="21" font-weight="700" letter-spacing="1.4">BUILD · DEBUG · LEARN · DEPLOY</text>
</svg>
