<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="Journey from Android to Flutter to backend to cloud">
<defs>
